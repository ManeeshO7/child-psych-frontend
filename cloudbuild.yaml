steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "us-central1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/mcare-frontend:${_TAG}"
      - "--build-arg"
      - "BACKEND_URL=${_BACKEND_URL}"
      - "--build-arg"
      - "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${_STRIPE_KEY}"
      - "--build-arg"
      - "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${_MAPS_KEY}"
      - "."
images:
  - "us-central1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/mcare-frontend:${_TAG}"
options:
  logging: CLOUD_LOGGING_ONLY
